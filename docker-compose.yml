services:
  isolated-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: brandseotool-browser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - CHROME_CLI=--load-extension=/extension --password-store=basic --enable-features=PasswordManager https://tools.brandseotool.com/
    volumes:
      - chromium-data:/config
      - ./downloads:/config/Downloads
      - ./:/extension:ro
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  chromium-data:
